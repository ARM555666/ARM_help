<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ARM แชทข้ามแดน (Discord ⇄ Web)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      --bg-main: #0d0e15;
      --bg-panel: rgba(22, 25, 41, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent-discord: #5865F2;
      --accent-discord-hover: #4752c4;
      --accent-web: #00d2ff;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --green-online: #23a55a;
      --red-offline: #f23f43;
      --yellow-wait: #f0b232;
      --card-bg: rgba(30, 34, 56, 0.6);
      --input-bg: rgba(18, 21, 35, 0.95);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Outfit', 'Noto Sans Thai', 'Noto Sans SC', sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #1a1c2e 0%, #0d0e15 100%);
      color: var(--text-main);
    }

    /* Ambient Background Glow */
    .glow-orb {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { top: -60px; left: -60px; background: var(--accent-discord); }
    .glow-2 { bottom: -60px; right: -60px; background: var(--accent-web); }

    /* App Container */
    .app-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
      background: transparent;
    }

    /* Modern Top Header */
    header {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--panel-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-discord), #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.35);
    }
    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow-wait);
      box-shadow: 0 0 6px var(--yellow-wait);
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .status-dot.online {
      background: var(--green-online);
      box-shadow: 0 0 8px var(--green-online);
    }
    .status-dot.offline {
      background: var(--red-offline);
      box-shadow: 0 0 8px var(--red-offline);
    }

    /* Header Right Actions */
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Nickname Pill */
    .name-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .name-pill span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .name-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent-web);
      font-weight: 600;
      font-size: 0.8rem;
      width: 80px;
      text-align: left;
    }

    /* Language Switcher */
    .lang-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 2px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 7px;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .lang-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 700;
    }

    /* Sound Button */
    .sound-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    /* Chat Messages Container */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar {
      width: 4px;
    }
    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
    }

    /* Empty State */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      padding: 30px 16px;
      max-width: 320px;
    }
    .empty-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
      opacity: 0.7;
    }
    .empty-state h3 {
      font-size: 1rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .empty-state p {
      font-size: 0.8rem;
      line-height: 1.45;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 86%;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.discord {
      align-self: flex-start;
    }
    .msg-row.web-self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.web-other {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .msg-row.discord .msg-avatar {
      border: 2px solid var(--accent-discord);
    }
    .msg-row.web-self .msg-avatar,
    .msg-row.web-other .msg-avatar {
      border: 2px solid var(--accent-web);
      background: linear-gradient(135deg, #00d2ff, #0066ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
      color: #fff;
    }

    .msg-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .msg-row.web-self .msg-body {
      align-items: flex-end;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
    }
    .msg-author {
      font-weight: 600;
      color: #e5e7eb;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-discord {
      background: rgba(88, 101, 242, 0.25);
      color: #93a0ff;
      border: 1px solid rgba(88, 101, 242, 0.4);
    }
    .badge-web {
      background: rgba(0, 210, 255, 0.2);
      color: #67e8f9;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }
    .msg-time {
      color: var(--text-muted);
      font-size: 0.65rem;
    }

    .bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-row.discord .bubble {
      background: rgba(88, 101, 242, 0.16);
      border: 1px solid rgba(88, 101, 242, 0.32);
      color: #f3f4f6;
      border-top-left-radius: 4px;
    }
    .msg-row.web-self .bubble {
      background: linear-gradient(135deg, #0088ff, #0066ee);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 120, 255, 0.25);
    }
    .msg-row.web-other .bubble {
      background: rgba(30, 36, 60, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f3f4f6;
      border-top-left-radius: 4px;
    }

    .attachment-img {
      margin-top: 6px;
      border-radius: 10px;
      max-width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--panel-border);
      cursor: pointer;
    }

    /* Bottom Input Bar (Sticky, Mobile Optimized) */
    .input-bar {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--panel-border);
      padding: 10px 12px;
      padding-bottom: max(10px, var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
    }

    .input-field {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 11px 16px;
      color: #fff;
      font-size: 16px; /* Prevents iOS Safari from zooming in! */
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: var(--accent-discord);
      box-shadow: 0 0 12px rgba(88, 101, 242, 0.3);
    }
    .input-field::placeholder {
      color: #6b7280;
      font-size: 0.88rem;
    }

    .send-button {
      background: linear-gradient(135deg, var(--accent-discord), #00a8cc);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(88, 101, 242, 0.35);
      transition: transform 0.15s;
    }
    .send-button:active {
      transform: scale(0.96);
    }

    @media (max-width: 480px) {
      .brand-title {
        font-size: 0.88rem;
      }
      .name-input {
        width: 65px;
      }
      .msg-row {
        max-width: 92%;
      }
      .send-text {
        display: none;
      }
      .send-button {
        padding: 11px 14px;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="app-wrapper">
    <!-- Top Header -->
    <header>
      <div class="header-left">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-title">ARM ช่วยคุณ ⇄ Web</div>
          <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">กำลังเชื่อมต่อ...</span>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Nickname -->
        <div class="name-pill" title="เปลี่ยนชื่อของคุณ">
          <span id="txt-name-label">ชื่อ:</span>
          <input type="text" id="usernameInput" class="name-input" value="เพื่อน (Friend)" maxlength="16">
        </div>

        <!-- Sound Alert -->
        <button class="sound-btn" id="soundToggleBtn" title="เสียงแจ้งเตือน">🔊</button>

        <!-- Languages -->
        <div class="lang-group">
          <button class="lang-btn active" id="btn-th" onclick="setLanguage('th')">TH</button>
          <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
          <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </header>

    <!-- Messages Container -->
    <main class="messages-area" id="messagesArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <h3 id="txt-empty-title">เริ่มต้นการสนทนา</h3>
        <p id="txt-empty-desc">ส่งข้อความที่นี่ ข้อความจะเด้งเข้าห้อง Discord แบบเรียลไทม์ และคำตอบจะแสดงที่นี่ทันที!</p>
      </div>
    </main>

    <!-- Input Bar -->
    <form class="input-bar" id="chatForm">
      <input
        type="text"
        id="messageInput"
        class="input-field"
        placeholder="พิมพ์ข้อความที่นี่..."
        autocomplete="off"
        maxlength="1500"
      >
      <button type="submit" class="send-button" id="sendBtn">
        <span class="send-text" id="txt-send-btn">ส่ง</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script>
    // Internationalization (TH / ZH / EN)
    const i18n = {
      th: {
        nameLabel: "ชื่อ:",
        emptyTitle: "เริ่มต้นการสนทนา",
        emptyDesc: "ส่งข้อความที่นี่ ข้อความจะเด้งเข้าห้อง Discord แบบเรียลไทม์ และคำตอบจะแสดงที่นี่ทันที!",
        placeholder: "พิมพ์ข้อความที่นี่...",
        send: "ส่ง",
        connecting: "กำลังเชื่อมต่อ...",
        online: "ออนไลน์",
        offline: "ออฟไลน์"
      },
      zh: {
        nameLabel: "昵称:",
        emptyTitle: "开始实时聊天",
        emptyDesc: "在此发送消息，将实时同步至 Discord 频道，频道回复也会立刻呈现在这里！",
        placeholder: "输入消息...",
        send: "发送",
        connecting: "连接中...",
        online: "已在线",
        offline: "离线"
      },
      en: {
        nameLabel: "Name:",
        emptyTitle: "Start Chatting",
        emptyDesc: "Send a message here to sync with Discord in real-time. Discord replies will appear instantly!",
        placeholder: "Type a message...",
        send: "Send",
        connecting: "Connecting...",
        online: "Online",
        offline: "Offline"
      }
    };

    let currentLang = 'th';

    function setLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang];

      document.getElementById('txt-name-label').innerText = t.nameLabel;
      document.getElementById('txt-empty-title').innerText = t.emptyTitle;
      document.getElementById('txt-empty-desc').innerText = t.emptyDesc;
      document.getElementById('messageInput').placeholder = t.placeholder;
      document.getElementById('txt-send-btn').innerText = t.send;

      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');
    }

    // Sound alert via Web Audio API (Zero audio file downloads required!)
    let soundEnabled = true;
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.innerText = soundEnabled ? '🔊' : '🔇';
    });

    function playChime() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // Nickname storage
    const usernameInput = document.getElementById('usernameInput');
    const savedName = localStorage.getItem('arm_chat_name');
    if (savedName) usernameInput.value = savedName;
    usernameInput.addEventListener('input', () => {
      localStorage.setItem('arm_chat_name', usernameInput.value.trim() || 'เพื่อน');
    });

    // Elements
    const messagesArea = document.getElementById('messagesArea');
    const emptyState = document.getElementById('emptyState');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let renderedIds = new Set();

    function updateStatus(isOnline, channelName) {
      const t = i18n[currentLang];
      if (isOnline) {
        statusDot.className = 'status-dot online';
        statusText.innerText = channelName ? `${t.online} (#${channelName})` : t.online;
      } else {
        statusDot.className = 'status-dot offline';
        statusText.innerText = t.offline;
      }
    }

    function scrollToBottom() {
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function formatTime(isoString) {
      try {
        const d = new Date(isoString);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return '';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMessage(msg, animate = true) {
      if (!msg || !msg.id || renderedIds.has(msg.id)) return;
      renderedIds.add(msg.id);

      emptyState.style.display = 'none';

      const isDiscord = msg.sender === 'discord';
      const myName = usernameInput.value.trim();
      const isSelf = !isDiscord && msg.author === myName;

      const row = document.createElement('div');
      row.className = `msg-row ${isDiscord ? 'discord' : (isSelf ? 'web-self' : 'web-other')}`;

      // Avatar
      let avatarHtml = '';
      if (isDiscord) {
        const avatarUrl = msg.avatar || 'https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png';
        avatarHtml = `<img src="${avatarUrl}" class="msg-avatar" alt="${escapeHtml(msg.author)}" onerror="this.src='https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png'">`;
      } else {
        const initial = (msg.author || 'W').charAt(0).toUpperCase();
        avatarHtml = `<div class="msg-avatar">${initial}</div>`;
      }

      // Badge
      const badge = isDiscord
        ? `<span class="badge badge-discord">Discord</span>`
        : `<span class="badge badge-web">Web</span>`;

      // Attachments
      let attachmentsHtml = '';
      if (msg.attachments && msg.attachments.length > 0) {
        msg.attachments.forEach(url => {
          attachmentsHtml += `<a href="${url}" target="_blank"><img src="${url}" class="attachment-img" alt="image" loading="lazy"></a>`;
        });
      }

      row.innerHTML = `
        ${avatarHtml}
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-author">${escapeHtml(msg.author)}</span>
            ${badge}
            <span class="msg-time">${formatTime(msg.timestamp)}</span>
          </div>
          <div class="bubble">
            ${escapeHtml(msg.text)}
            ${attachmentsHtml}
          </div>
        </div>
      `;

      messagesArea.appendChild(row);
      scrollToBottom();
    }

    // Realtime Connection (Socket.IO + Auto HTTP Fallback for Vercel Serverless)
    let socketConnected = false;
    let socket = null;

    if (typeof io !== 'undefined') {
      try {
        socket = io({ reconnectionAttempts: 5, timeout: 5000 });

        socket.on('connect', () => {
          socketConnected = true;
          updateStatus(true);
        });

        socket.on('bot_status', (status) => {
          updateStatus(status.connected, status.channelName);
        });

        socket.on('history', (history) => {
          if (history && history.length > 0) {
            history.forEach(m => renderMessage(m, false));
          }
        });

        socket.on('chat_message', (msg) => {
          renderMessage(msg, true);
          if (msg.sender === 'discord' || msg.author !== usernameInput.value.trim()) {
            playChime();
          }
        });

        socket.on('disconnect', () => {
          socketConnected = false;
          updateStatus(false);
        });
      } catch (err) {
        console.warn('Socket.IO not available, using polling');
      }
    }

    // HTTP Polling fallback (ensures 100% operation on Vercel Serverless)
    async function pollMessages() {
      try {
        const res = await fetch('/api/messages');
        if (res.ok) {
          const data = await res.json();
          if (data.botStatus) {
            updateStatus(data.botStatus.connected, data.botStatus.channelName);
          }
          if (data.messages && data.messages.length > 0) {
            data.messages.forEach(m => {
              const prevCount = renderedIds.size;
              renderMessage(m, false);
              if (renderedIds.size > prevCount && !socketConnected) {
                if (m.sender === 'discord' || m.author !== usernameInput.value.trim()) {
                  playChime();
                }
              }
            });
          }
        }
      } catch (e) {}
    }

    // Poll every 2.5 seconds if socket is not active or as safety sync
    setInterval(() => {
      if (!socketConnected) pollMessages();
    }, 2500);
    pollMessages();

    // Send Message
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      const author = usernameInput.value.trim() || 'เพื่อน';

      if (!text) return;

      messageInput.value = '';

      if (socketConnected && socket) {
        socket.emit('send_message', { text, author });
      } else {
        // Fallback HTTP POST for Vercel
        try {
          const res = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, author })
          });
          const data = await res.json();
          if (data.msgData) {
            renderMessage(data.msgData, true);
          }
        } catch (err) {
          console.error('Send error:', err);
        }
      }

      messageInput.focus();
    });
  </script>
</body>
</html>
